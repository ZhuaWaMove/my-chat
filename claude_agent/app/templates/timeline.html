<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>News Timeline - Claude Agent</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/vis-timeline/7.7.0/vis-timeline-graph2d.min.css" rel="stylesheet" type="text/css" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f8f9fa;
        }
        .navbar {
            box-shadow: 0 2px 4px rgba(0,0,0,.1);
        }
        .timeline-container {
            height: 600px;
            border: 1px solid #dee2e6;
            border-radius: 8px;
            background: white;
            margin-bottom: 20px;
        }
        .controls {
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 4px rgba(0,0,0,.1);
            margin-bottom: 20px;
        }
        .event-detail {
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 4px rgba(0,0,0,.1);
            margin-top: 20px;
        }
        .event-type-badge {
            display: inline-block;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: 600;
            margin-right: 8px;
        }
        .event-type-news { background-color: #e3f2fd; color: #1565c0; }
        .event-type-alert { background-color: #ffebee; color: #c62828; }
        .event-type-positive_news { background-color: #e8f5e9; color: #2e7d32; }
        .event-type-milestone { background-color: #f3e5f5; color: #7b1fa2; }
        .importance-star {
            color: #ffc107;
            margin-right: 2px;
        }
        .loading {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 400px;
            font-size: 18px;
            color: #6c757d;
        }
    </style>
</head>
<body>
    <!-- Navigation -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="/">
                <i class="fas fa-newspaper me-2"></i>Claude Agent News Timeline
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="/">Chat</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" href="/news/timeline">Timeline</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/news/feed-sources">Feed Sources</a>
                    </li>
                </ul>
                <div class="d-flex">
                    <button class="btn btn-outline-light me-2" onclick="refreshTimeline()">
                        <i class="fas fa-sync-alt"></i> Refresh
                    </button>
                </div>
            </div>
        </div>
    </nav>

    <!-- Main Container -->
    <div class="container-fluid mt-4">
        <div class="row">
            <!-- Controls Panel -->
            <div class="col-lg-3">
                <div class="controls">
                    <h5><i class="fas fa-sliders-h me-2"></i>Filters & Controls</h5>

                    <!-- Date Range -->
                    <div class="mb-3">
                        <label class="form-label">Date Range</label>
                        <div class="input-group mb-2">
                            <span class="input-group-text"><i class="fas fa-calendar-alt"></i></span>
                            <input type="date" id="startDate" class="form-control" placeholder="Start Date">
                        </div>
                        <div class="input-group">
                            <span class="input-group-text"><i class="fas fa-calendar-alt"></i></span>
                            <input type="date" id="endDate" class="form-control" placeholder="End Date">
                        </div>
                    </div>

                    <!-- Event Types -->
                    <div class="mb-3">
                        <label class="form-label">Event Types</label>
                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" value="news" id="typeNews" checked>
                            <label class="form-check-label" for="typeNews">
                                <span class="event-type-badge event-type-news">News</span>
                            </label>
                        </div>
                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" value="positive_news" id="typePositive" checked>
                            <label class="form-check-label" for="typePositive">
                                <span class="event-type-badge event-type-positive_news">Positive</span>
                            </label>
                        </div>
                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" value="alert" id="typeAlert" checked>
                            <label class="form-check-label" for="typeAlert">
                                <span class="event-type-badge event-type-alert">Alert</span>
                            </label>
                        </div>
                    </div>

                    <!-- Importance Filter -->
                    <div class="mb-3">
                        <label class="form-label">Importance</label>
                        <input type="range" class="form-range" id="importanceRange" min="1" max="5" value="1">
                        <div class="form-text">Minimum Importance: <span id="importanceValue">1</span></div>
                    </div>

                    <!-- Search -->
                    <div class="mb-3">
                        <label class="form-label">Search</label>
                        <div class="input-group">
                            <input type="text" id="searchQuery" class="form-control" placeholder="Search events...">
                            <button class="btn btn-primary" onclick="searchEvents()">
                                <i class="fas fa-search"></i>
                            </button>
                        </div>
                    </div>

                    <!-- Apply Filters -->
                    <button class="btn btn-primary w-100" onclick="applyFilters()">
                        <i class="fas fa-filter me-2"></i>Apply Filters
                    </button>
                </div>

                <!-- Stats Panel -->
                <div class="controls mt-3">
                    <h5><i class="fas fa-chart-bar me-2"></i>Statistics</h5>
                    <div id="statsContent">
                        <div class="text-center">
                            <div class="spinner-border spinner-border-sm text-primary" role="status"></div>
                            <span class="ms-2">Loading statistics...</span>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Timeline Panel -->
            <div class="col-lg-9">
                <div class="timeline-container" id="timeline"></div>

                <!-- Event Details -->
                <div class="event-detail" id="eventDetail" style="display: none;">
                    <h5 id="eventTitle"></h5>
                    <div class="mb-2">
                        <span id="eventTypeBadge" class="event-type-badge"></span>
                        <span id="eventDate" class="text-muted"></span>
                        <span id="eventImportance" class="float-end"></span>
                    </div>
                    <p id="eventDescription"></p>
                    <div id="eventTags" class="mb-3"></div>
                    <div id="eventKeyPoints"></div>
                    <button class="btn btn-outline-primary btn-sm" onclick="hideEventDetail()">
                        <i class="fas fa-times me-1"></i>Close
                    </button>
                </div>

                <!-- Loading Indicator -->
                <div class="loading" id="loadingIndicator">
                    <div class="text-center">
                        <div class="spinner-border text-primary" role="status" style="width: 3rem; height: 3rem;"></div>
                        <p class="mt-3">Loading timeline events...</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/vis-timeline/7.7.0/vis-timeline-graph2d.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="/static/js/timeline.js"></script>
</body>
</html>
